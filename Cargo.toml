[package]
name = "xplane-log-triage"
version = "0.2.0"
edition = "2021"

[features]
default = []
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
eframe = { version = "0.29", optional = true }
rfd = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "xplane-log-triage"
path = "src/main.rs"

[[bin]]
name = "xplane-log-triage-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[profile.release]
strip = true
lto = true
codegen-units = 1
